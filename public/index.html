<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypersign KYC Integration</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
            color: #162033;
            background: #f6f8fb;
        }

        .hidden {
            display: none;
        }

        video,
        canvas {
            width: 100%;
            border-radius: 8px;
            background: #000;
            margin: 10px 0;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 5px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.68;
        }

        .button-loader {
            align-items: center;
            display: inline-flex;
            gap: 8px;
            justify-content: center;
        }

        .button-loader::before {
            animation: spin 0.8s linear infinite;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-top-color: #fff;
            border-radius: 50%;
            content: "";
            height: 14px;
            width: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .step-card {
            background: #fff;
            border: 1px solid #dce3ec;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .choice-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .verifier-header {
            text-align: left;
        }

        .verifier-header h3 {
            margin-bottom: 6px;
        }

        .verifier-header p {
            color: #526070;
            margin-top: 0;
        }

        .tab-list {
            background: #eef3f8;
            border: 1px solid #d7e0ea;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin: 18px 0;
            padding: 4px;
        }

        .tab-button {
            background: transparent;
            border-radius: 6px;
            color: #2a394b;
            margin: 0;
        }

        .tab-button.active {
            background: #fff;
            color: #0b5ed7;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
        }

        .tab-panel {
            border: 1px solid #e1e7ef;
            border-radius: 8px;
            padding: 18px;
            text-align: left;
        }

        .tab-panel h4 {
            margin: 0 0 6px;
        }

        .tab-panel p {
            color: #526070;
            margin: 0 0 14px;
        }

        .tab-panel .choice-row {
            justify-content: flex-start;
        }

        .result-box {
            background: #f3f7fc;
            border: 1px solid #d8e4f0;
            border-radius: 8px;
            margin-top: 14px;
            padding: 12px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #status-msg {
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>

<body>

    <h2>Identity Verification</h2>

    <div id="app">
        <div id="step-init" class="step-card">
            <p>Please enter your details to begin identity verification.</p>

            <div class="input-group" style="margin-bottom: 15px; text-align: left;">
                <label for="user-name" style="display: block; margin-bottom: 5px;">Full Name</label>
                <input type="text" id="user-name" placeholder="John Doe"
                    style="width: 100%; padding: 8px; box-sizing: border-box;">
            </div>

            <div class="input-group" style="margin-bottom: 20px; text-align: left;">
                <label for="user-email" style="display: block; margin-bottom: 5px;">Email Address</label>
                <input type="email" id="user-email" placeholder="john@example.com"
                    style="width: 100%; padding: 8px; box-sizing: border-box;">
            </div>

            <button id="start-btn" onclick="validateAndStart()">Start ID Verification</button>
        </div>

        <div id="step-document-type" class="step-card hidden">
            <div class="verifier-header">
                <p>Choose the custom verification flow or launch the hosted Hypersign widget.</p>
            </div>

            <div class="tab-list" role="tablist" aria-label="Verification type">
                <button id="custom-tab" class="tab-button active" type="button" onclick="showVerifierTab('custom')">
                    Custom Widget
                </button>
                <button id="hypersign-tab" class="tab-button" type="button" onclick="showVerifierTab('hypersign')">
                    Hypersign Widget
                </button>
            </div>

            <div id="custom-panel" class="tab-panel">
                <p>Select the document type you want to scan.</p>

                <div class="choice-row">
                    <button onclick="selectDocumentType('GOVT_ID')">Government ID</button>
                    <button onclick="selectDocumentType('PASSPORT')">Passport</button>
                </div>
            </div>

            <div id="hypersign-panel" class="tab-panel hidden">
                <p>Start a fresh hosted widget session for this user.</p>

                <button id="hypersign-widget-btn" type="button" onclick="openHypersignWidget()">Open Hypersign Widget</button>
                <div id="widget-result" class="result-box hidden"></div>
            </div>
        </div>

        <div id="camera-container" class="step-card hidden">
            <h3 id="camera-title">Capture Document</h3>
            <video id="video" autoplay playsinline style="width: 100%; max-width: 400px; border-radius: 8px;"></video>
            <div style="margin-top: 10px;">
                <button id="capture-btn">Snap Photo</button>
            </div>
            <p id="status-msg"></p>
            <canvas id="canvas" class="hidden"></canvas>
        </div>

        <div id="step-final" class="step-card hidden">
            <h3 style="color: green;">Verification Complete!</h3>
            <p id="result-text"></p>
            <button onclick="location.reload()">Start ID Verification</button>
        </div>
    </div>
    <script>
        // Configuration Constants
        const KYC_BASE_URL = "https://api.cavach.hypersign.id";
        const SSI_BASE_URL = "https://api.entity.hypersign.id";
        let widgetUrl = "";

        /** * Application State Object 
         * Centralizes all tokens and IDs generated during the flow.
         */
        const state = {
            tokens: {
                kycAdmin: "",
                ssiAdmin: "",
                userBearer: ""
            },
            issuer: {
                did: "",
                methodId: ""
            },
            user: {
                did: "",
                methodId: ""
            },
            session: {
                id: "",
                extractionToken: ""
            },
            documentType: "",
            documentFront: "",
            documentBack: ""
        };

        const userInputState = {
            name: "",
            email: ""
        };

        let isStarting = false;
        let isOpeningWidget = false;
        let hasOpenedHypersignWidget = false;
        let currentStep = "init";
        let widgetWindow = null;
        const captureBtn = document.getElementById("capture-btn");
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const startBtn = document.getElementById("start-btn");
        const hypersignWidgetBtn = document.getElementById("hypersign-widget-btn");

        window.addEventListener("message", handleWidgetMessage);

        function validateAndStart() {
            if (isStarting) return;
            const name = document.getElementById('user-name').value.trim();
            const email = document.getElementById('user-email').value.trim();

            if (!name || !email) {
                alert("Name and Email are required to start verification.");
                return;
            }

            userInputState.name = name;
            userInputState.email = email;

            // Pass the UI values into the async process
            startKycProcess(name, email);
        }

        /**
         * Step 1: Initialize Session
         * Fetches required tokens and session context from your local backend.
         */
        async function startKycProcess(name, email) {
            isStarting = true;
            setButtonLoading(startBtn, true, "Starting...");
            updateStatus("Initializing session...");
            try {
                await refreshKycSession(name, email);

                showDocumentTypeStep();
            } catch (error) {
                handleError("Initialization Error", error);
            } finally {
                isStarting = false;
                setButtonLoading(startBtn, false);
            }
        }

        async function refreshKycSession(name, email) {
            const response = await fetch(`${window.location.origin}/get-required-tokens-and-session-for-a-user`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name,
                    email
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || data.message || "Failed to reach backend");
            }

            state.tokens.kycAdmin = data.kycAdminToken;
            state.tokens.ssiAdmin = data.ssiAdminToken;
            state.tokens.userBearer = data.kycUserAccessToken || data.userBearerToken;
            widgetUrl = data.widgetUrl || "";
            state.issuer.did = data.issuerDid;
            state.issuer.methodId = data.issuerVerificationMethodId;
            state.session.id = data.sessionId;
            state.user.did = data.userDid;
            state.user.methodId = data.userVerificationMethodId;

            return data;
        }

        function showDocumentTypeStep() {
            currentStep = "document-type";
            document.querySelectorAll(".step-card").forEach(el => el.classList.add("hidden"));
            document.getElementById("step-document-type").classList.remove("hidden");
            showVerifierTab("custom");
            document.getElementById("widget-result").classList.add("hidden");
        }

        function showVerifierTab(tabName) {
            const isCustom = tabName === "custom";

            document.getElementById("custom-tab").classList.toggle("active", isCustom);
            document.getElementById("hypersign-tab").classList.toggle("active", !isCustom);
            document.getElementById("custom-panel").classList.toggle("hidden", !isCustom);
            document.getElementById("hypersign-panel").classList.toggle("hidden", isCustom);
        }

        async function openHypersignWidget() {
            if (isOpeningWidget || hasOpenedHypersignWidget) return;

            if (!widgetUrl) {
                alert("Widget URL is not configured. Add WIDGET_URL to your environment.");
                return;
            }

            if (!state.session.id || !state.tokens.userBearer) {
                alert("Please start verification first.");
                return;
            }

            isOpeningWidget = true;
            setButtonLoading(hypersignWidgetBtn, true, "Opening widget...");
            showWidgetResult("Opening widget with the current verification session...");

            try {
                const url = buildWidgetUrl();

                widgetWindow = window.open(url, "hypersignKycWidget", "width=520,height=760");

                if (!widgetWindow) {
                    throw new Error("Popup blocked. Please allow popups for this site.");
                }

                widgetWindow.focus();
                hasOpenedHypersignWidget = true;
                disableButton(hypersignWidgetBtn, "Widget opened");
                showWidgetResult(`Widget opened.\nSession ID: ${state.session.id}\nReload the page to start a new session.`);
            } catch (error) {
                handleInlineError("Widget Error", error);
                setButtonLoading(hypersignWidgetBtn, false);
            } finally {
                isOpeningWidget = false;
            }
        }

        function buildWidgetUrl() {
            const url = new URL(widgetUrl, window.location.origin);
            url.searchParams.set("kycAccessToken", state.tokens.kycAdmin);
            url.searchParams.set("ssiAccessToken", state.tokens.ssiAdmin);
            url.searchParams.set("sessionId", state.session.id);
            url.searchParams.set("kycUserAccessToken", state.tokens.userBearer);
            return url.toString();
        }

        function handleWidgetMessage(event) {
            if (!widgetUrl) return;

            const expectedOrigin = new URL(widgetUrl, window.location.origin).origin;
            if (event.origin !== expectedOrigin) return;
            showWidgetResult(formatWidgetResult(event.data));
        }

        function formatWidgetResult(data) {
            if (typeof data === "string") {
                return data;
            }

            return JSON.stringify(data, null, 2);
        }

        function showWidgetResult(message) {
            const resultEl = document.getElementById("widget-result");
            resultEl.innerText = message;
            resultEl.classList.remove("hidden");
        }

        function handleInlineError(title, err) {
            console.error(`${title}:`, err);
            showWidgetResult(`${title}: ${err.message}`);
        }

        function setButtonLoading(button, isLoading, loadingText) {
            if (!button) return;

            if (isLoading) {
                button.dataset.defaultText = button.innerText;
                button.disabled = true;
                button.innerHTML = `<span class="button-loader">${loadingText || button.innerText}</span>`;
                return;
            }

            button.disabled = false;
            button.innerText = button.dataset.defaultText || button.innerText;
        }

        function disableButton(button, text) {
            if (!button) return;

            button.disabled = true;
            button.innerText = text;
        }

        function selectDocumentType(documentType) {
            state.documentType = documentType;
            state.documentFront = "";
            state.documentBack = "";

            if (documentType === "PASSPORT") {
                showCameraUI("Capture Passport (Front)", "doc-extract");
                return;
            }

            showCameraUI("Capture ID Card (Front)", "doc-extract");
        }

        async function processDocumentExtraction(frontImage, backImage) {
            updateStatus("Extracting data from document...");

            try {
                const extractionBody = {
                    documentFront: frontImage,
                    sessionId: state.session.id,
                    documentType: state.documentType
                };

                if (state.documentType === "GOVT_ID") {
                    extractionBody.documentBack = backImage;
                    extractionBody.countryCode = "IND";
                }

                const response = await fetch(`${KYC_BASE_URL}/api/v2/documents/extract`, {
                    method: "POST",
                    headers: createHeaders(true),
                    body: JSON.stringify(extractionBody)
                });

                const result = await response.json();
                if (!result.success) throw new Error(result.message || "Extraction failed");

                state.session.extractionToken = result.data.extractionToken;
                showCameraUI("Take a Live Selfie", "liveness");
            } catch (error) {
                handleError("OCR Error", error);
            }
        }

        /**
         * Step 3: Face Match & Identity Verification
         * Matches the selfie against the extracted document data.
         */
        async function performIdentityMatch(base64Selfie) {
            updateStatus("Verifying identity match...");
            try {
                const response = await fetch(`${KYC_BASE_URL}/api/v2/biometrics/verify`, {
                    method: 'POST',
                    headers: {
                        ...createHeaders(true),
                        'x-issuer-did': state.issuer.did,
                        'x-issuer-did-ver-method': state.issuer.methodId
                    },
                    body: JSON.stringify({
                        documentToken: state.session.extractionToken,
                        sessionId: state.session.id,
                        selfieImage: base64Selfie,
                        holderDid: state.user.did,
                    })
                });

                const result = await response.json();
                if (result.success) {
                    await submitUserConsent(result.data.credentials);
                } else {
                    throw new Error("Identity match failed.");
                }
            } catch (error) {
                handleError("Verification Error", error);
            }
        }

        /**
         * Step 4: User Consent & Presentation
         * Signs the verifiable credentials and completes the session.
         */
        async function submitUserConsent(credentials) {
            updateStatus("Finalizing verification...");
            try {
                const vp = await createSsiPresentation(credentials);
                const response = await fetch(`${KYC_BASE_URL}/api/v2/consents`, {
                    method: 'POST',
                    headers: createHeaders(true),
                    body: JSON.stringify({
                        sessionId: state.session.id,
                        presentation: vp.presentation
                    })
                });

                const result = await response.json();
                if (!response.ok || result.success === false) {
                    throw new Error(result.message || result.error || "Consent submission failed");
                }

                displayFinalStep();
            } catch (error) {
                handleError("Consent Error", error);
            }
        }

        /**
         * Helper: Creates Verifiable Presentation via SSI Service
         */
        async function createSsiPresentation(credentialDocuments) {
            const response = await fetch(`${SSI_BASE_URL}/api/v1/presentation`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${state.tokens.ssiAdmin}`
                },
                body: JSON.stringify({
                    credentialDocuments,
                    holderDid: state.user.did,
                    challenge: state.session.id,
                    domain: window.location.origin,
                    verificationMethodId: state.user.methodId
                })
            });
            const result = await response.json();

            if (!response.ok || result.success === false || !result.presentation) {
                throw new Error(result.message || result.error || "Failed to create SSI presentation");
            }

            return result;
        }

        /**
         * Utility: Generates repeated headers for KYC/SSI calls
         */
        function createHeaders(includeUserToken = false) {
            const headers = {
                'Content-Type': 'application/json',
                'x-kyc-access-token': state.tokens.kycAdmin,
                'x-ssi-access-token': state.tokens.ssiAdmin
            };
            if (includeUserToken) {
                headers['Authorization'] = `Bearer ${state.tokens.userBearer}`;
            }
            return headers;
        }

        // --- UI Logic Helpers ---

        function updateStatus(msg) {
            document.getElementById('status-msg').innerText = msg;
        }

        function handleError(title, err) {
            console.error(`${title}:`, err);
            alert(`${title}: ${err.message}`);
            location.reload();
        }

        function displayFinalStep() {
            document.getElementById('camera-container').classList.add('hidden');
            document.getElementById('step-document-type').classList.add("hidden");
            document.getElementById('step-final').classList.remove('hidden');
            document.getElementById('result-text').innerText = "Verification Successful.";
        }

        // --- CAMERA UTILITY ---
        async function showCameraUI(title, step) {
            currentStep = step;
            updateStatus('');
            document.querySelectorAll('.step-card').forEach(el => el.classList.add('hidden'));
            document.getElementById('camera-container').classList.remove('hidden');
            document.getElementById('camera-title').innerText = title;

            const constraints = {
                video: {
                    facingMode: step === "liveness" ? "user" : "environment",
                    width: {
                        ideal: 1920
                    },
                    height: {
                        ideal: 1080
                    }
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access denied or not available.");
            }
        }

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }

        captureBtn.onclick = async () => {
            const ctx = canvas.getContext("2d");
            const targetWidth = 1400;
            const scale = targetWidth / video.videoWidth;

            canvas.width = targetWidth;
            canvas.height = video.videoHeight * scale;
            ctx.filter = "contrast(110%) brightness(105%)";
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64Image = canvas.toDataURL("image/jpeg", 1.0);

            stopCamera();
            updateStatus("Processing... please wait.");

            if (currentStep === "doc-extract") {
                state.documentFront = base64Image;

                if (state.documentType === "PASSPORT") {
                    await processDocumentExtraction(state.documentFront);
                    return;
                }

                showCameraUI("Capture ID Card (Back)", "doc-back");
            } else if (currentStep === "doc-back") {
                state.documentBack = base64Image;
                await processDocumentExtraction(state.documentFront, state.documentBack);
            } else if (currentStep === "liveness") {
                await performIdentityMatch(base64Image);
            }
        };

    </script>
</body>

</html>
